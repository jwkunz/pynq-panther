# /etc/panther/panther.conf - settings for panther-session (the boot-time desktop).
# Set enabled=false to keep the board headless without removing anything.
enabled = true
# account that runs the desktop session
user = xilinx
# virtual terminal X uses (7 keeps clear of the login consoles)
vt = 7
# kernel module, if it was not installed with depmod
module = /usr/local/lib/panther/panther_drm.ko
session = /usr/local/lib/panther/session.sh
# how often X may fail before the board is left headless
max_restarts = 3
# seconds to wait for the base overlay to be loaded into the PL
pl_timeout = 120
